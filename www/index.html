function spend(){const o=[];recs().forEach(r=>{if(r.c=='expense')o.push({cat:r.d.kind=='Fine'?'Fines':r.d.kind,amt:+r.d.amount,date:r.d.date});else if((r.c=='insurance'||r.c=='pa')&&r.d.premium)o.push({cat:'Premiums',amt:+r.d.premium,date:r.d.start})});return o}
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function months(){const a=[],n=new Date();for(let i=5;i>=0;i--)a.push(ym(new Date(n.getFullYear(),n.getMonth()-i,1)));return a}
function monthly(){const s=spend();return months().map(m=>s.filter(x=>(x.date||'').slice(0,7)==m).reduce((a,b)=>a+b.amt,0))}
function bars(v,h,c){const m=Math.max(...v,1);return `<svg viewBox="0 0 120 ${h}" width="100%" height="${h}" preserveAspectRatio="none">${v.map((x,i)=>`<rect x="${i*20+3}" y="${h-Math.max(x/m*(h-4),3)}" width="14" height="${Math.max(x/m*(h-4),3)}" rx="4" fill="${c}"/>`).join('')}</svg>`}
function donut(it){const t=it.reduce((a,b)=>a+b.v,0);if(!t)return'<p>Add a vehicle to see this chart.</p>';let off=0;const C=2*Math.PI*40;return `<div style="position:relative;width:130px;height:130px"><svg viewBox="0 0 100 100" width="130" height="130" style="transform:rotate(-90deg)">${it.map((x,i)=>{const l=x.v/t*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[i%5]}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><b style="font-size:24px">${t}</b><p style="margin:0;font-size:11px">vehicles</p></div></div></div>`}
const recTitle=r=>r.c=='expense'?`${r.d.kind} · ${inr(r.d.amount)}`:r.d.name;
/* ---- HOME ---- */

const dated=R.filter(x=>x.c!='expense'&&(x.d.expiry||x.d.service)).map(x=>({...x,due:x.d.expiry||x.d.service})).sort((a,b)=>a.due<b.due?-1:1);const soon=dated.filter(x=>days(x.due)<=30).length;
const fines=sp.filter(x=>x.cat=='Fines').reduce((a,b)=>a+b.amt,0);

<div class="hero"><p>Total spend this year</p><div class="big">${inr(yr)}</div>${bars(monthly(),44,'rgba(255,255,255,.85)')}<p style="margin-top:6px">${soon?`⏰ ${soon} item${soon>1?'s':''} due within 30 days`:'✅ Nothing due soon'}</p></div>
<div class="grid"><div class="kpi"><span>Vehicles</span><b>${V.length}</b></div><div class="kpi"><span>Due ≤ 30 days</span><b style="color:${soon?'var(--warn)':'var(--ok)'}">${soon}</b></div></div>
${statusStrip(V)}${aiCard()}${newsCard()}${vcards(V)}<h2>Upcoming due dates</h2>${dated.length?dated.slice(0,6).map(x=>`<div class="card row"><div class="ic">${CATS[x.c].ic}</div><div class="grow"><b>${x.d.name}</b><p style="margin:0">${catLabel(x)} · ${x.due}</p></div>${badge(x.due)}${days(x.due)<=30?`<a onclick="opts('${x.c}')">Options ↗</a>`:''}</div>`).join(''):'<div class="card"><p>Nothing yet. Tap ➕ to add your first vehicle.'+(window.NATIVE&&fbOn()&&!S.get('vw_gmode_'+st.user)?' New phone? Connect Google Drive in More to restore your records.':'')+'</p></div>'}`}
function vcards(V){if(!V.length)return'';return '<h2>My vehicles</h2>'+V.map(x=>{const key=x.d.name+' · '+x.d.reg;return `<div class="card"><div class="row"><div class="ic">${VI[x.d.vtype]||'🚗'}</div><div class="grow"><b>${x.d.name}</b><p style="margin:0">${x.d.reg} · ${x.d.make||''} ${x.d.model||''} · ${x.d.usage||''}</p></div>${stB(vstatus(x))}</div>${['insurance','puc','pa'].map(c=>{const m=recs().filter(r=>r.c==c&&r.d.name==key).sort((a,b)=>a.d.expiry<b.d.expiry?1:-1)[0];return `<div class="row" style="margin-top:10px"><div class="grow">${CATS[c].ic} ${CATS[c].name}${m&&m.d.ptype?` <span class="chip" style="margin:0">${m.d.ptype}</span>`:''}</div>${m?badge(m.d.expiry):`<a onclick="newRec('${c}','${x.id}')">+ Add</a>`}</div>`}).join('')}</div>`}).join('')}
/* ---- INSIGHTS ---- */
function insights(){const V=recs().filter(x=>x.c=='vehicle'),sp=spend();const tv=VT.map(t=>({n:t,v:V.filter(x=>x.d.vtype==t).length})).filter(x=>x.v);
const cats=['Service','Consumables','Fines','Premiums'].map(c=>({n:c,v:sp.filter(x=>x.cat==c).reduce((a,b)=>a+b.amt,0)}));const tot=cats.reduce((a,b)=>a+b.v,0),mx=Math.max(...cats.map(x=>x.v),1);

return `<h1>Insights</h1><p>Your vehicles and spending at a glance</p>
<div class="grid" style="margin-top:12px"><div class="kpi"><span>Total spend</span><b>${inr(tot)}</b></div><div class="kpi"><span>Fines paid</span><b style="color:var(--bad)">${inr(cats[2].v)}</b></div><div class="kpi"><span>Service + consumables</span><b>${inr(cats[0].v+cats[1].v)}</b></div><div class="kpi"><span>Premiums</span><b>${inr(cats[3].v)}</b></div></div>
<h2>Vehicles by type</h2><div class="card row">${donut(tv)}<div class="grow">${tv.map((x,i)=>`<div style="margin:4px 0"><span style="color:${COL[i%5]}">●</span> ${VI[x.n]} ${x.n} <b>${x.v}</b></div>`).join('')}<span class="chip">Personal ${pc}</span><span class="chip">Commercial ${V.length-pc}</span></div></div>
<h2>Spend by category</h2><div class="card">${cats.map((c,i)=>`<div style="margin:10px 0"><div class="row"><div class="grow">${c.n}</div><b>${inr(c.v)}</b></div><div class="bar"><i style="width:${c.v/mx*100}%;background:${COL[i]}"></i></div></div>`).join('')}</div>
<h2>Last 6 months</h2><div class="card">${bars(monthly(),90,'#6d5dfc')}<div class="row" style="justify-content:space-between;font-size:11px;color:var(--mut)">${months().map(m=>`<span>${m.slice(5)}</span>`).join('')}</div></div>`}

function pick(){return `<h1>Add details</h1><p>Choose a category</p><div class="grid" style="margin-top:14px">${Object.entries(CATS).map(([k,c])=>`<button class="cat" onclick="newRec('${k}')"><span>${c.ic}</span>${c.name}</button>`).join('')}</div>`}
function newRec(c,vid){st.tab='add';st.cat=c;st.editId=null;st.fname='';st.docs=[];draw();const v=vid&&recs().find(x=>x.id==vid);if(v&&$('f_name'))$('f_name').value=v.d.name+' · '+v.d.reg}

<div class="ai"><b>✨ Upload &amp; auto-fill with AI</b><p>Upload your RC, policy or PUC (photo or PDF). Details are read automatically and the file is stored with this record. You verify and correct.</p><div class="row" style="margin-top:10px;gap:10px"><button type="button" class="btn sm" style="margin:0" onclick="$('fl').click()">📷 Take photo</button><button type="button" class="btn ghost sm" style="margin:0" onclick="$('fl2').click()">🖼️ Choose file</button></div><input type="file" id="fl" accept="image/*" capture="environment" onchange="scan(this)" hidden><input type="file" id="fl2" accept="image/*,application/pdf" onchange="scan(this)" hidden><div id="pv"></div><div id="dl">${docList()}</div></div>

function setOpts(id,l){const s=$(id);if(s)s.innerHTML='<option value="">Select</option>'+l.map(x=>`<option>${x}</option>`).join('')}

function scan(inp){const f=inp.files[0];if(!f)return;inp.value='';const pv=$('pv');okFile(f).then(ok=>{if(!ok){inp.value='';pv.innerHTML=`<p class='err'>That file was blocked. Use a JPG, PNG, WEBP, GIF or PDF up to 10 MB.</p>`;return}scan2(f,pv)})}
function scan2(f,pv){st.fname=clean(f.name);
const go=()=>{pv.insertAdjacentHTML('beforeend','<p>🔎 Reading document…</p>');setTimeout(()=>{const d=DEMO[st.cat]||{};let n=0;Object.entries(d).forEach(([k,v])=>{const el=$('f_'+k);if(el&&!el.value){el.value=v;el.classList.add('chk');n++}});pv.lastChild.textContent=`✅ Demo scan filled ${n} field(s) with sample values (orange border). Please verify each one. The real app reads your actual document on-device.`},900)};
if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1280/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.72);pv.innerHTML=`<img class="pv" src="${u}">`;addDoc(f.name,'image',u);const k='vw_cache_'+st.user,ca=S.get(k)||{};ca[f.name]=u;S.set(k,ca);go()};im.src=r.result};r.readAsDataURL(f)}else{pv.innerHTML=`<p>📄 ${clean(f.name)}</p>`;if(f.size<3e5){const r2=new FileReader();r2.onload=()=>addDoc(f.name,'pdf',r2.result);r2.readAsDataURL(f)}else addDoc(f.name,'pdf','');go()}}

function saveRec(){const c=CATS[st.cat],d={},er={};document.querySelectorAll('.err').forEach(x=>x.textContent='');
c.f.forEach(f=>{const el=$('f_'+f.k);let v=(el?el.value:'').trim();if(f.up)v=v.toUpperCase().replace(/\s/g,'');d[f.k]=v;const E=m=>er[f.k]=m;

function askCache(){const n=Object.keys(S.get('vw_cache_'+st.user)||{}).length;modal('Clear cache?',`This removes ${n} cached scan preview(s) from this device. Records and Drive files are <b>not</b> affected.`,[{l:'Clear cache',a:"closeM();S.del('vw_cache_'+st.user);toast('Cache cleared')"},{l:'Cancel',c:'ghost',a:'closeM()'}])}
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
const ST={'Good':'ok','In progress':'prog','Pending':'pend','Due Soon':'warn','Expired':'bad'},SC={'Good':'var(--ok)','In progress':'#3b82f6','Pending':'#a855f7','Due Soon':'var(--warn)','Expired':'var(--bad)'};
const fmt=d=>d?d.split('-').reverse().join('-'):'—';
const fmtReg=r=>(r||'').replace(/^([A-Z]{2})(\d{1,2})([A-Z]{1,3})(\d{4})$/,'$1 $2 $3 $4');
const stB=s=>`<span class="pill ${ST[s]}">${s}</span>`;
const dst=d=>{const n=days(d);return n<0?'Expired':n<=30?'Due Soon':'Good'};
const vkey=v=>v.d.name+' · '+v.d.reg;
function latest(c,k){return recs().filter(r=>r.c==c&&r.d.name==k).sort((a,b)=>a.d.expiry<b.d.expiry?1:-1)[0]}
function vstatus(v){const k=vkey(v),i=latest('insurance',k),p=latest('puc',k),ds=[v.d.expiry,i&&i.d.expiry,p&&p.d.expiry].filter(Boolean).map(days),m=(i?0:1)+(p?0:1);return ds.some(n=>n<0)?'Expired':ds.some(n=>n<=30)?'Due Soon':m==2?'In progress':m==1?'Pending':'Good'}
function allStatus(){const o={};Object.keys(ST).forEach(s=>o[s]=0);recs().forEach(r=>{if(r.c=='vehicle')o[vstatus(r)]++;else if(r.c=='dl')o[dst(r.d.expiry)]++});return o}
function statusStrip(V){if(!recs().length)return'';const o=allStatus();return `<div class="card"><div class="row"><b class="grow">Status overview</b><span><a onclick="st.tab='insights';draw()">Insights</a> &nbsp; <a onclick="st.tab='records';st.sheet=1;draw()">Open sheet →</a></span></div>${Object.keys(ST).map(s=>`<span class="chip"><span style="color:${SC[s]}">●</span> <b>${o[s]}</b> ${s}</span>`).join('')}</div>`}
function sheetHtml(){const R=recs(),V=R.filter(x=>x.c=='vehicle'),L=R.filter(x=>x.c=='dl');let n=0;const rows=V.map(v=>{const k=vkey(v),i=latest('insurance',k),p=latest('puc',k);return `<tr><td>${++n}</td><td>${v.d.name}</td><td>${v.d.vtype}</td><td>${fmtReg(v.d.reg)}</td><td>${v.d.chassis}</td><td>${fmt(v.d.expiry)}</td><td>${i?i.d.provider:'—'}</td><td>${i?fmt(i.d.expiry):'—'}</td><td>${p?fmt(p.d.expiry):'—'}</td><td>${stB(vstatus(v))}</td></tr>`}).concat(L.map(l=>`<tr><td>${++n}</td><td>${l.d.name} DL</td><td>${l.d.classes}</td><td>${l.d.dlno}</td><td>NA</td><td>${fmt(l.d.expiry)}</td><td></td><td></td><td></td><td>${stB(dst(l.d.expiry))}</td></tr>`));return `<div class="scroll" style="margin-top:10px"><table><tr><th>#</th><th>Vehicle name</th><th>Type</th><th>Registration</th><th>Chassis</th><th>RC expiry</th><th>Insurance co.</th><th>Insurance expiry</th><th>Emission expiry</th><th>Status</th></tr>${rows.join('')||'<tr><td colspan=10>No data</td></tr>'}</table></div>`}
const addDoc=(name,type,data)=>{st.docs.push({name:clean(name),type,data});const d=$('dl');if(d)d.innerHTML=docList()};
const docList=()=>st.docs.map((x,i)=>`<div class="row" style="margin-top:8px"><div class="grow">${x.type=='image'?'🖼️':'📄'} ${x.name}${x.data?'':' <span style="color:var(--warn)">(large file: name saved only)</span>'}</div><a onclick="rmDoc(${i})">Remove</a></div>`).join('');
const rmDoc=i=>{st.docs.splice(i,1);$('dl').innerHTML=docList()};
function viewDocs(id){const r=recs().find(x=>x.id==id);modal('Attached documents',(r.docs||[]).map(x=>x.type=='image'&&x.data?`<p>${x.name}</p><img class="pv" src="${x.data}" style="max-height:260px">`:`<p>📄 ${x.name} (PDF stored with this record)</p>`).join(''),[{l:'Close',c:'ghost',a:'closeM()'}])}
function tips(){const R=recs(),V=R.filter(x=>x.c=='vehicle'),o=[];if(!V.length)return [{ic:'🚀',t:'Start with your first vehicle',b:'Add RC details once; insurance, PUC and expenses link to it.'}];
V.forEach(v=>{const k=vkey(v),i=latest('insurance',k),p=latest('puc',k);[['Insurance',i],['PUC',p]].forEach(([n,m])=>{if(!m)o.push({ic:'📌',k:n=='PUC'?'puc':'insurance',t:`${n} missing for ${v.d.name}`,b:'Add it to move this vehicle to Good status.'});else{const d=days(m.d.expiry);if(d<0)o.push({ic:'🚨',k:n=='PUC'?'puc':'insurance',t:`${n} expired for ${v.d.name}`,b:`Expired ${-d} days ago. Driving without valid ${n} can attract a fine, so renew now.`});else if(d<=30)o.push({ic:'⏰',k:n=='PUC'?'puc':'insurance',t:`${n} due in ${d} days for ${v.d.name}`,b:'Renew a few days early so there is no gap in cover.'})}});
if(i&&i.d.ptype&&i.d.ptype.startsWith('3rd'))o.push({ic:'⚠️',k:'insurance',t:`${v.d.name} has third-party cover only`,b:'Your own vehicle is not covered for accident, theft or fire. Consider comprehensive at renewal.'});if(!v.d.service)o.push({ic:'🔧',t:`Set a next service date for ${v.d.name}`,b:'Regular service lowers breakdown risk and resale loss.'})});
const nd=R.filter(r=>['vehicle','insurance','puc','pa','dl'].includes(r.c)&&!(r.docs||[]).length).length;if(nd)o.push({ic:'📎',t:`${nd} record(s) have no document attached`,b:'Attach RC, policy and PUC copies so everything is in one place when you need it.'});
const f=spend().filter(x=>x.cat=='Fines');if(f.length>=2)o.push({ic:'🚦',t:`${f.length} fines logged (${inr(f.reduce((a,b)=>a+b.amt,0))})`,b:'Check where they repeat (parking, speed, signals).'});
const P=['🚨','⏰','⚠️','📌','🔧','📎','🚦'];o.sort((a,b)=>P.indexOf(a.ic)-P.indexOf(b.ic));return o.length?o:[{ic:'✅',t:'All good',b:'Everything is up to date. I’ll keep watching your dates.'}]}
const QS=[['due','What’s due soon?'],['ins','Am I well covered?'],['save','Save money'],['docs','Missing documents']];
function aiCard(){const t=tips()[0];return `<div class="ai"><div class="row"><div class="ic">✨</div><div class="grow"><b>Vault AI</b><p style="margin:0;white-space:normal">${t.ic} ${t.t}</p></div></div>${QS.map(([k,l])=>`<span class="chipb" onclick="goAI('${k}','${l}')">${l}</span>`).join('')}<span class="chipb" onclick="st.tab='ai';draw()">Ask anything →</span></div>`}
function ans(k){const R=recs(),V=R.filter(x=>x.c=='vehicle');if(!V.length&&k!='x')return 'I don’t have any vehicles yet. Add one (or load sample data in More) and I’ll start tracking.';
if(k=='due'){const d=R.filter(x=>x.c!='expense'&&(x.d.expiry||x.d.service)).map(x=>({n:x.d.name+' ('+CATS[x.c].name+')',d:x.d.expiry||x.d.service})).sort((a,b)=>a.d<b.d?-1:1).filter(x=>days(x.d)<=30);return d.length?'Needs attention:<br>'+d.map(x=>`• ${x.n}: ${fmt(x.d)} · ${days(x.d)<0?'expired '+(-days(x.d))+'d ago':days(x.d)+' days left'}`).join('<br>'):'Nothing is due or expired in the next 30 days. 🎉'}
if(k=='ins')return V.map(v=>{const i=latest('insurance',vkey(v));return `• ${v.d.name}: ${i?(i.d.ptype||'policy')+' with '+i.d.provider+', '+(days(i.d.expiry)<0?'EXPIRED':'valid till '+fmt(i.d.expiry)):'no insurance recorded'}`}).join('<br>')+'<br><br>Tip: comprehensive cover also protects your own vehicle.';
if(k=='save'){const sp=spend(),c=n=>sp.filter(x=>x.cat==n).reduce((a,b)=>a+b.amt,0);return `Total tracked: ${inr(sp.reduce((a,b)=>a+b.amt,0))} (service ${inr(c('Service'))}, consumables ${inr(c('Consumables'))}, fines ${inr(c('Fines'))}, premiums ${inr(c('Premiums'))}).<br>• Renew before expiry to keep your no-claim bonus.<br>• Compare insurers at renewal.<br>• Fines are avoidable: keep PUC and insurance current.`}
if(k=='docs'){const m=R.filter(x=>['vehicle','insurance','puc','pa','dl'].includes(x.c)&&!(x.docs||[]).length);return m.length?'No document attached to:<br>'+m.map(x=>'• '+CATS[x.c].name+': '+x.d.name).join('<br>'):'Every record has a document attached. 👏'}
return 'Snapshot: '+V.length+' vehicle(s). '+Object.entries(allStatus()).filter(x=>x[1]).map(x=>x[1]+' '+x[0]).join(', ')+'. Ask me about due dates, insurance, savings or documents.'}
function topic(q){q=q.toLowerCase();return /due|expir|renew|soon/.test(q)?'due':/insur|cover|policy/.test(q)?'ins':/sav|cost|spend|money|fine|cheap/.test(q)?'save':/doc|rc|upload|missing|file/.test(q)?'docs':'x'}
function goAI(k,l){st.chat.push({q:l,a:ans(k)});st.tab='ai';draw()}
function askAI(){const q=$('aq').value.trim();if(!q)return;st.chat.push({q:q.replace(/</g,'&lt;'),a:ans(topic(q))});draw()}

return `<div class='card row' onclick='NATIVE.toggleRem()' style='cursor:pointer'><div class='ic'>🔔</div><div class='grow'><b>Reminders</b><p style='margin:0'>${rem?'30, 7 and 1 day before, and on the day':'Get a phone notification before things expire'}</p></div>${pill(rem,'On','Off')}</div>`
+(rem?`<div class='card row' onclick='NATIVE.testRem()' style='cursor:pointer'><div class='ic'>🧪</div><div class='grow'><b>Send a test reminder</b><p style='margin:0'>Arrives in 5 seconds</p></div>›</div>`:'')
+`<div class='card row' onclick='NATIVE.toggleBio()' style='cursor:pointer'><div class='ic'>🔐</div><div class='grow'><b>Fingerprint, face or screen lock</b><p style='margin:0'>Locks the app after 30 seconds away</p></div>${pill(bio,'On','Off')}</div>`
+(g?`<div class='card row' onclick='NATIVE.syncNow(false)' style='cursor:pointer'><div class='ic'>☁️</div><div class='grow'><b>Google Drive</b><p style='margin:0;white-space:normal'>${ds?(ds.ok?'Saved ':'Not saved: ')+ds.msg+' · '+ds.at+' · My Drive › VeloDVault':'Not saved yet. Tap to sync now · saves to My Drive › VeloDVault'}</p></div>${pill(ds&&ds.ok,'Synced','Sync')}</div>`:`<div class='card row' onclick='NATIVE.connectDrive()' style='cursor:pointer'><div class='ic'>☁️</div><div class='grow'><b>Connect Google Drive</b><p style='margin:0;white-space:normal'>Back up to your own Drive and restore on another phone</p></div>›</div>`)}
const catLabel=r=>CATS[r.c].name+(r.c=='custom'?' · '+unclean(r.d.cat||'General'):'');
const catList=()=>`<datalist id='dl_cat'>${[...new Set(recs().filter(r=>r.c=='custom'&&r.d.cat).map(r=>unclean(r.d.cat)))].map(x=>`<option value="${clean(x)}">`).join('')}</datalist>`;
function customGroups(){const g={};recs().filter(r=>r.c=='custom').forEach(r=>{const k=unclean(r.d.cat||'General');(g[k]=g[k]||[]).push(r)});return g}
function customCols(rows){return [...new Set(rows.flatMap(r=>Object.keys(r.d.extra||{})))]}
function customSheets(){const g=customGroups();return Object.keys(g).map(k=>{const rows=g[k],ex=customCols(rows);return `<h2>Custom · ${clean(k)}</h2><div class='scroll'><table><tr><th>Title</th><th>Notes</th><th>Reminder date</th>${ex.map(x=>`<th>${x}</th>`).join('')}<th>Edited</th></tr>${rows.map(r=>`<tr><td>${r.d.name||''}</td><td>${r.d.note||''}</td><td>${fmt(r.d.expiry)}</td>${ex.map(x=>`<td>${(r.d.extra||{})[x]||''}</td>`).join('')}<td>${r.edited||'—'}</td></tr>`).join('')}</table></div>`}).join('')}
const fbOn=()=>!!(window.FBAUTH&&FBAUTH.enabled);
async function fbAuth(){const em=$('em').value.trim().toLowerCase(),pw=$('pw').value;st.errs={};st.em=em;
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))st.errs.em='Enter a valid email';if(pw.length<8)st.errs.pw='Password must be at least 8 characters';
if(st.mode=='signup'&&!$('cn').checked)st.errs.cn='Please confirm the privacy notice and that you are 18 or older';
if(Object.keys(st.errs).length)return draw();
try{const r=st.mode=='signup'?await FBAUTH.signUp(em,pw):await FBAUTH.signIn(em,pw);if(!r.verified){st.mode='verify';return draw()}fbDone(r.email)}
catch(e){dlog('email sign-up/in',e);st.errs[e&&e.code=='auth/email-already-in-use'?'em':'pw']=FBAUTH.friendly(e);draw()}}
function fbDone(em){const u=users(),o=u[em]||{};u[em]=Object.assign({},o,{fb:true,consent:o.consent||nowS()});delete u[em].h;delete u[em].salt;delete u[em].pw;S.set('vw_users',u);st.mode='signin';login(em)}
function verifyUI(){return `<div class="hero"><div class="big">📧 Check your email</div><p>We sent a verification link to <b>${clean(st.em||'')}</b>. Open it, then come back and tap the button below.</p></div>${e('vf')}<button class="btn" onclick="fbCheck()">I have verified my email</button><button class="btn ghost" onclick="fbResend()">Send the link again</button><button class="btn ghost" onclick="fbBack()">Use a different email</button><p style="text-align:center;font-size:12px">Not there? Check spam. The link works from any device.</p>`}
async function fbCheck(){try{const r=await FBAUTH.check();if(!r){st.mode='signin';return draw()}if(!r.verified){st.errs.vf='Not verified yet. Open the link in the email first.';return draw()}st.errs={};fbDone(r.email)}catch(e){dlog('verify check',e);st.errs.vf=FBAUTH.friendly(e);draw()}}
async function fbResend(){try{await FBAUTH.resend();toast('Verification email sent again')}catch(e){toast(FBAUTH.friendly(e))}}
async function fbBack(){try{await FBAUTH.signOut()}catch(e){}st.mode='signup';st.errs={};draw()}
async function fbForgot(){const em=$('em').value.trim().toLowerCase();st.em=em;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){st.errs.em='Enter your email first';return draw()}
try{await FBAUTH.reset(em)}catch(e){if(!e||e.code!=='auth/user-not-found'){toast(FBAUTH.friendly(e));return}}
modal('Check your email',`<p style='white-space:normal'>If an account exists for <b>${clean(em)}</b>, we have sent a link to reset the password. Open it from any device, then sign in with the new password.</p><p style='white-space:normal;font-size:12px'>Not there? Check spam.</p>`,[{l:'OK',a:'closeM()'}])}
async function signOut(){if(fbOn()&&users()[st.user]&&users()[st.user].fb){try{await FBAUTH.signOut()}catch(e){}}st.user=null;S.set('vw_session',null);draw()}
const DIAG=true,APPVER='1.9',DLOG=[];
function dlog(w,e){DLOG.unshift({t:nowS(),w,c:(e&&e.code)||'',m:String(e&&e.message||e).slice(0,200)});if(DLOG.length>20)DLOG.length=20}
const mask=x=>{x=String(x||'');return x.length>12?x.slice(0,6)+'…'+x.slice(-4):x};
const SCI={ok:'✅',bad:'❌',warn:'⚠️'};let SCR=[];
function fbCfgRow(){const c=window.VV_FIREBASE||{};if(!c.apiKey||String(c.apiKey).indexOf('YOUR_')==0||String(c.projectId||'').indexOf('YOUR_')==0)return ['bad','Firebase values are still placeholders in firebase-config.js (the app is in test mode)'];return ['ok','Firebase values present: project '+c.projectId+', key '+mask(c.apiKey)]}
function googleCfgRow(){const id=(window.VV_CONFIG&&VV_CONFIG.googleWebClientId)||'';if(!id||id.indexOf('YOUR_')==0)return ['bad','Google Web client ID is still a placeholder in config.js'];if(!/\.apps\.googleusercontent\.com$/.test(id))return ['bad','The ID in config.js does not end with .apps.googleusercontent.com'];return ['ok','Google Web client ID present: '+mask(id)+' (it must be the Web application one)']}
function identRow(){try{if(window.VVNative&&VVNative.info){const j=JSON.parse(VVNative.info());if(j.error)return ['warn','Could not read the app identity ('+j.error+')'];return ['ok','Package name: '+j.pkg+'\nSHA-1: '+j.sha1+'\nSHA-256: '+j.sha256+'\nIn Google Cloud, the Android client must use exactly this package name and this SHA-1.']}}catch(e){}return ['warn',window.NATIVE?'This build cannot read its own identity':'Shown only in the Android app']}
function scBase(){SCR=[['App version','ok','Version '+APPVER+(window.NATIVE?' · Android app':' · web')],['This app (for Google setup)'].concat(identRow()),['Firebase settings'].concat(fbCfgRow()),['Google settings'].concat(googleCfgRow())]}
function scDraw(){const b=$('sc');if(b)b.innerHTML=SCR.map(r=>`<div class='row' style='margin:8px 0;align-items:flex-start'><span>${SCI[r[1]]}</span><div class='grow'><b style='white-space:normal'>${r[0]}</b><p style='margin:0;white-space:normal;word-break:break-all'>${esc(String(r[2])).replace(/\n/g,'<br>')}</p></div></div>`).join('')+(DLOG.length?`<p style='font-size:12px;white-space:normal'><b>Latest errors:</b><br>${DLOG.slice(0,5).map(x=>esc(x.t+' '+x.w+' '+x.c+' '+x.m)).join('<br>')}</p>`:'')}
function setupCheck(){scBase();modal('Setup check',"<div id='sc'></div>",[{l:'Run checks',a:'runChecks()'},{l:'Test Google sign-in',c:'ghost',a:'testGoogle()'},{l:'Copy report',c:'ghost',a:'copyReport()'},{l:'Close',c:'ghost',a:'closeM()'}],1);scDraw()}
async function probeFirebase(){const c=window.VV_FIREBASE||{};if(fbCfgRow()[0]=='bad')return ['bad','Skipped: Firebase values are placeholders'];
try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(c.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'setup-check@example.invalid',password:'not-a-real-password',returnSecureToken:true})});const j=await r.json().catch(()=>({})),m=String(j.error&&j.error.message||'');
if(/EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|INVALID_EMAIL/.test(m))return ['ok','Firebase answers, the key is valid and Email/Password sign-in is switched on'];
if(/OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m))return ['bad','Email/Password sign-in is NOT switched on (Firebase > Authentication > Sign-in method)'];
if(/API key not valid|API_KEY_INVALID|INVALID_KEY/i.test(m+JSON.stringify(j)))return ['bad','The Firebase key in this build is not valid. Copy it again from Project settings > Your apps > Web app'];
if(/CONFIGURATION_NOT_FOUND/.test(m))return ['bad','Authentication is not started (Firebase > Authentication > Get started)'];
if(r.status==403)return ['bad','The key is blocked or restricted (403): '+m.slice(0,120)];
return ['warn','Unexpected answer ('+r.status+'): '+m.slice(0,120)]}catch(e){dlog('firebase check',e);return ['bad','Could not reach Firebase (internet, or blocked): '+String(e&&e.message||e).slice(0,100)]}}
async function runChecks(){scBase();SCR.push(['Firebase live test','warn','Testing…']);scDraw();const r=await probeFirebase();SCR[SCR.length-1]=['Firebase live test'].concat(r);scDraw()}
async function testGoogle(){if(!window.NATIVE){SCR.push(['Google test','warn','Works only in the Android app']);scDraw();return}
const g=googleCfgRow();if(g[0]=='bad'){SCR.push(['Google test','bad','Skipped: '+g[1]]);scDraw();return}
SCR.push(['Google sign-in test','warn','Choose your Google account when asked…']);scDraw();const i=SCR.length-1;
try{const em=await NATIVE.googleLogin();SCR[i]=['Google sign-in test','ok','Signed in as '+em+' and Drive permission was granted'];scDraw();
try{await NATIVE.probeDrive();SCR.push(['Drive access test','ok','Drive answered. Saving and restoring should work.'])}catch(e){dlog('drive test',e);SCR.push(['Drive access test','bad','Drive refused: '+String(e&&e.message||e).slice(0,120)+'. Is the Drive API enabled in the same project?'])}}
catch(e){dlog('google test',e);SCR[i]=['Google sign-in test','bad',gErr(e)]}scDraw()}
function reportText(){return ['VeloDVault setup report','Version '+APPVER+(window.NATIVE?' Android app':' web'),'Time '+nowS()].concat(SCR.map(r=>SCI[r[1]]+' '+r[0]+': '+r[2]),['Latest errors:'],DLOG.slice(0,8).map(x=>'- '+x.t+' | '+x.w+' | '+x.c+' | '+x.m)).join('\n')}
function copyReport(){const t=reportText();const fb=()=>modal('Copy this report',`<textarea id='rp' rows='9' readonly style='font-size:12px'>${esc(t)}</textarea><p style='font-size:12px'>Select all, copy, and send it to support.</p>`,[{l:'Close',c:'ghost',a:'closeM()'}]);
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Report copied. Paste it into your message.'),fb);else fb()}
function togglePw(i,b){const f=$(i),t=$(b),show=f.type=='password';f.type=show?'text':'password';t.textContent=show?'Hide':'Show';t.setAttribute('aria-pressed',show);t.setAttribute('aria-label',show?'Hide password':'Show password')}
async function setNewPw(){const p=$('np').value;if(p.length<8){$('npe').textContent='Use at least 8 characters';return}const em=st.em,u=users(),salt=crypto.randomUUID();u[em]=Object.assign({},u[em],{salt,h:await pbk(p,salt)});delete u[em].pw;S.set('vw_users',u);const lk=S.get('vw_lock')||{};delete lk[em];S.set('vw_lock',lk);closeM();toast('Password changed. Sign in with the new one.');draw()}
function wipe(id){const u=users();delete u[id];S.set('vw_users',u);['vw_r_','vw_bin_','vw_cache_','vw_tk_','vw_pref_','vw_poll_','vw_streak_','vw_gmode_','vw_drvids_','vw_drvstat_','vw_lastsync_'].forEach(k=>S.del(k+id))}
function askErase(){modal('Erase this account?',`<p style='white-space:normal'>This removes the account and all its records from this browser. Type <b>DELETE</b> to confirm.</p><input id='dc' autocomplete='off'><div class='err' id='de'></div>`,[{l:'Erase',c:'red',a:'eraseAcc()'},{l:'Cancel',c:'ghost',a:'closeM()'}])}
function eraseAcc(){if($('dc').value!=='DELETE'){$('de').textContent='Type DELETE to confirm';return}wipe(st.em);closeM();draw();toast('Account erased')}
function boot(){const sess=S.get('vw_session');if(sess&&users()[sess])st.user=sess;$('app').style.zoom=S.get('vw_zoom')||1;if(window.NATIVE)NATIVE.bootLock();draw();if(fbOn())FBAUTH.onChange(u=>{const cu=st.user&&users()[st.user];if(!u&&cu&&cu.fb){st.user=null;S.set('vw_session',null);draw();toast('You were signed out. Please sign in again.')}});if(window.NATIVE&&st.user)remindNow()}
window.SECINIT?SECINIT().then(boot,boot):boot();
</script><script>if('serviceWorker' in navigator&&!(window.VVP&&VVP.native)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
